(function () {
  function bar(text) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#c00;color:#fff;font:13px monospace;padding:6px 10px;white-space:pre-wrap';
    d.textContent = text;

    bar('ОШИБКА: ' + msg + '  (строка ' + line + ':' + col + ')');

  };
  window.addEventListener('unhandledrejection', function (e) {
    bar('ОШИБКА (promise): ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
})();

/* ================== БАЗА ================== */

/* ================== ПРИМИТИВЫ ================== */
function hs(a, b) {
  var h = (a * 374761393 + b * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function strh(s) {
  var h = 7;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
var MC = {};
function mix(c, a) {
  var k = c + '|' + a;
  if (MC[k]) return MC[k];
  var r = parseInt(c.substr(1, 2), 16), gg = parseInt(c.substr(3, 2), 16), b = parseInt(c.substr(5, 2), 16);
  var t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round(r + (t - r) * p); gg = Math.round(gg + (t - gg) * p); b = Math.round(b + (t - b) * p);
  MC[k] = 'rgb(' + r + ',' + gg + ',' + b + ')';

/* косая проекция: u вправо, v вниз (сжата), z вверх со сдвигом влево */
function P(u, v, z) {
  return [Math.round(OX + u * Z - z * Z * 0.28), Math.round(OY + v * Z * K - z * Z)];
}
function rect(x, y, w, h, c) {
  if (w <= 0 || h <= 0) return;
  g.fillStyle = c;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
/* пиксель-точная заливка выпуклого многоугольника построчно */
function polyFill(pts, c) {
  g.fillStyle = c;
  var n = pts.length, y0 = 1e9, y1 = -1e9, i, y, yy, xmin, xmax, a, b, x;
  for (i = 0; i < n; i++) { if (pts[i][1] < y0) y0 = pts[i][1]; if (pts[i][1] > y1) y1 = pts[i][1]; }
  for (y = y0; y < y1; y++) {
    yy = y + 0.5; xmin = 1e9; xmax = -1e9;
    for (i = 0; i < n; i++) {
      a = pts[i]; b = pts[(i + 1) % n];
      if ((a[1] <= yy && b[1] > yy) || (b[1] <= yy && a[1] > yy)) {
        x = a[0] + (yy - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
        if (x < xmin) xmin = x;
        if (x > xmax) xmax = x;
      }

    if (xmax >= xmin) {
      var xa = Math.round(xmin), xb = Math.round(xmax);
      g.fillRect(xa, y, Math.max(1, xb - xa), 1);

/* линия Брезенхэма со слиянием горизонтальных отрезков */
function lineP(a, b, c) {
  g.fillStyle = c;
  var x0 = a[0], y0 = a[1], x1 = b[0], y1 = b[1];
  if (x0 === x1) { g.fillRect(x0, Math.min(y0, y1), 1, Math.abs(y1 - y0) + 1); return; }
  var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy, n = 0;
  var rs = x0, ry = y0, rl = 0;
  for (;;) {
    if (y0 !== ry) { g.fillRect(Math.min(rs, rs + rl * sx - sx * 0 ), ry, 1, 1); }
    break;
  }
  /* простой и надёжный вариант: пиксель за пикселем, горизонтальные серии сливаются */
  x0 = a[0]; y0 = a[1]; e = dx + dy; rs = x0; ry = y0; rl = 1;
  for (;;) {
    if (x0 === x1 && y0 === y1) break;

    if (e2 >= dy) { e += dy; nx += sx; }
    if (e2 <= dx) { e += dx; ny += sy; }
    if (ny === ry) { rl++; }
    else { g.fillRect(Math.min(rs, rs + (rl - 1) * sx), ry, rl, 1); rs = nx; ry = ny; rl = 1; }
    x0 = nx; y0 = ny;

function qV(u0, u1, z0, z1, v) { return [P(u0, v, z0), P(u1, v, z0), P(u1, v, z1), P(u0, v, z1)]; }
function qU(v0, v1, z0, z1, u) { return [P(u, v0, z0), P(u, v1, z0), P(u, v1, z1), P(u, v0, z1)]; }

function brickV(u0, u1, z0, z1, v) {

var PP_STATUS = { green: 'рапорт + сводка 7:00', yellow: 'только суточный', gray: 'нет данных' };
